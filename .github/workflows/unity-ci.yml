# Unity CI — compiles the C# and runs the EditMode test suite on every push.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE   contents of your .ulf licence file (Personal) — GameCI activation docs
#   UNITY_EMAIL     the Unity account email
#   UNITY_PASSWORD  the Unity account password (alphanumeric only; avoid special characters)
#   UNITY_SERIAL    only for Plus/Pro licences, instead of UNITY_LICENSE
#
# The Unity version comes from ProjectInfinity/ProjectSettings/ProjectVersion.txt
# (6000.0.51f1), so bumping the editor only requires changing that file.
# See https://game.ci/docs/github/test-runner and https://game.ci/docs/github/builder

name: Unity CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  editmode-tests:
    name: Compile + EditMode tests (Unity 6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ProjectInfinity/Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectInfinity/Assets/**', 'ProjectInfinity/Packages/**', 'ProjectInfinity/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Compiles every assembly (Runtime, Editor, Tests) before running them, so this step is the
      # compile gate: a C# error fails the job here.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: ProjectInfinity
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: test-results
          if-no-files-found: ignore

  build:
    name: Build Linux x64
    needs: editmode-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ProjectInfinity/Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectInfinity/Assets/**', 'ProjectInfinity/Packages/**', 'ProjectInfinity/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # CiBuild generates the prototype scene (it is not committed, it is authored by code) and
      # then builds a player, throwing BuildFailedException on any build error.
      - name: Build player
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ProjectInfinity
          targetPlatform: StandaloneLinux64
          buildMethod: ProjectInfinity.EditorTools.CiBuild.BuildLinux64
          allowDirtyBuild: true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectInfinity-linux-x64
          path: build/StandaloneLinux64
          if-no-files-found: error
